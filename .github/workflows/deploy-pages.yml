name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run check
      - name: Unit tests (join engine, parsing, storage, exports)
        run: npm run test:unit
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npx playwright test --project=chromium

      # Separate project: builds with the real /elegant-joins/ base and serves it at
      # that sub-path. The root-served suite cannot catch base-path bugs — the first
      # deploy showed a 404 to every visitor while all other tests passed.
      - name: Deployed-path smoke tests
        run: npx playwright test --project=pages-base

      # Serial on purpose: importing and joining real files on a React Flow canvas at a
      # 390px viewport is slow enough that parallel workers starve each other into
      # timing flakes which pass individually.
      - name: Phone-viewport tests
        run: npx playwright test --project=mobile --workers=1
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    # Never publish a build that failed its tests.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build (base path /elegant-joins/)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
