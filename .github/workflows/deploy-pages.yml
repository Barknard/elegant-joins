name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Everything used to run as ONE serial job — install, type-check, unit, browser install,
# desktop e2e, deployed-path e2e, then the serial mobile suite. That took 14 minutes,
# and a failure anywhere meant no deploy and no signal about the rest. These jobs run in
# parallel instead, and the slow suites are sharded, so wall-clock is roughly the longest
# single shard rather than the sum of everything.

jobs:
  check:
    name: Types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit

  e2e-desktop:
    name: Desktop e2e (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: report-desktop-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  e2e-deployed-path:
    name: Deployed /elegant-joins/ path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Small and fast, but the only thing that can catch a base-path bug: the first
      # deploy of this app served a 404 to every visitor while all other tests passed.
      - run: npx playwright test --project=pages-base

  e2e-mobile:
    name: Phone viewport (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # workers=1 WITHIN a shard: this canvas is CPU-bound at 390px and parallel workers
      # starve each other into timing flakes. Sharding gives back the parallelism across
      # machines instead, without the contention.
      - run: npx playwright test --project=mobile --workers=1 --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: report-mobile-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  deploy:
    # Never publish something that failed its tests.
    needs: [check, e2e-desktop, e2e-deployed-path, e2e-mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - name: Build (base path /elegant-joins/)
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
